name: skills
version: 1.0.0
description: APM project for skills
author: ansanloms
targets:
  - claude
dependencies:
  apm: []
  mcp: []
devDependencies:
  apm:
    - mizchi/skills/empirical-prompt-tuning
    - git: nanaism/yomiyasu
      skills:
        - yomiyasu
    - ansanloms/skills/ja-tech-proofread
includes: auto
scripts: {}
lifecycle:
  post-install:
  - type: command
    description: npm ci
    command: 'rc=0; for d in .claude/skills/*/scripts; do [ -f "$d/package-lock.json" ] || continue; node -e ''const p=require(process.argv[1]);process.exit(Object.keys(p.dependencies||{}).length?0:1)'' "$PWD/$d/package.json" || continue; echo "npm ci: $d"; npm ci --omit=dev --prefix "$d" || rc=1; done; exit $rc'
    timeoutSec: 300
